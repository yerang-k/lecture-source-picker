<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="바이브코딩 강의 소스 카드를 골라 슬라이드 요청문을 만드는 조합기">
<title>강의 소스 조합기</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 바이브 프로젝트 허브 v3.2 디자인 토큰 이식 (미스트 블루 · 코발트 · 톤온톤) */
:root{
 --font-main:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,Roboto,"Noto Sans KR",sans-serif;
 --bg:#eef3f9;--bg-soft:#e1ebf5;--card:#ffffff;--line:#d4e1ef;--line-strong:#b8cce2;
 --text:#1c2b3b;--text-2:#495d73;--text-3:#73889e;
 --accent:#2f5f9e;--accent-hover:#234b80;--accent-soft:#e4eef9;--accent-border:#bdd3ec;--on-accent:#ffffff;
 --gold:#966020;--gold-bg:#f8f1e5;--gold-border:#e8d3ac;
 --ok:#2b6777;--ok-bg:#e5f2f5;--danger:#9e4747;
 --scrim:rgba(15,23,42,.45);
 --radius:16px;--radius-lg:22px;
 --shadow-xs:0 1px 2px rgba(24,48,79,.04);--shadow:0 4px 14px rgba(24,48,79,.05);--shadow-hover:0 14px 28px -6px rgba(24,48,79,.11);--shadow-modal:0 24px 48px -12px rgba(15,23,42,.22);
 --ease:all .2s cubic-bezier(.22,1,.36,1);
 --logo-a:#2f5f9e;--logo-b:#1e4273;
 --class-c:#2f5f9e;--class-s:#e5effa;--class-b:#c3daf2;
 --admin-c:#3b526b;--admin-s:#e7edf4;--admin-b:#c7d4e2;
 --event-c:#29699c;--event-s:#e4f1fb;--event-b:#bee0f6;
 --life-c:#2b6b7d;--life-s:#e3f2f6;--life-b:#bde0ea;
 --resource-c:#3f5582;--resource-s:#e8edf7;--resource-b:#c7d3ec;
 --study-c:#266596;--study-s:#e4f0fa;--study-b:#bfd9f2;
 --tip-c:#46617a;--tip-s:#e8eff5;--tip-b:#c8d7e6;
 --qna-c:#2c6882;--qna-s:#e3f1f7;--qna-b:#bce0ed;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1824;--bg-soft:#17243a;--card:#15202f;--line:#263a52;--line-strong:#35506e;
 --text:#e4edf7;--text-2:#a9bbd0;--text-3:#7f95ad;
 --accent:#6ea6e6;--accent-hover:#8bbcf0;--accent-soft:#1b2f4a;--accent-border:#2f4e75;--on-accent:#0b1522;
 --gold:#e0b46a;--gold-bg:#3a2f1a;--gold-border:#5a4825;--ok:#6fc0d0;--ok-bg:#16323a;--danger:#e08a8a;
 --scrim:rgba(0,0,0,.6);--shadow:0 4px 14px rgba(0,0,0,.25);--shadow-hover:0 14px 28px -6px rgba(0,0,0,.4);
 --logo-a:#3d74b8;--logo-b:#24508a;
 --class-c:#97afce;--class-s:#16283f;--class-b:#1c3455;
 --admin-c:#9da8b5;--admin-s:#192534;--admin-b:#212f40;
 --event-c:#94b4ce;--event-s:#152a3e;--event-b:#193854;
 --life-c:#95b5be;--life-s:#152a38;--life-b:#1a3948;
 --resource-c:#9faac0;--resource-s:#1a2539;--resource-b:#22304a;
 --study-c:#92b2ca;--study-s:#14293d;--study-b:#183752;
 --tip-c:#a2b0bc;--tip-s:#1b2837;--tip-b:#253546;
 --qna-c:#96b4c0;--qna-s:#152a39;--qna-b:#1b384a;
 color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1824;--bg-soft:#17243a;--card:#15202f;--line:#263a52;--line-strong:#35506e;
 --text:#e4edf7;--text-2:#a9bbd0;--text-3:#7f95ad;
 --accent:#6ea6e6;--accent-hover:#8bbcf0;--accent-soft:#1b2f4a;--accent-border:#2f4e75;--on-accent:#0b1522;
 --gold:#e0b46a;--gold-bg:#3a2f1a;--gold-border:#5a4825;--ok:#6fc0d0;--ok-bg:#16323a;--danger:#e08a8a;
 --scrim:rgba(0,0,0,.6);--shadow:0 4px 14px rgba(0,0,0,.25);--shadow-hover:0 14px 28px -6px rgba(0,0,0,.4);
 --logo-a:#3d74b8;--logo-b:#24508a;
 --class-c:#97afce;--class-s:#16283f;--class-b:#1c3455;
 --admin-c:#9da8b5;--admin-s:#192534;--admin-b:#212f40;
 --event-c:#94b4ce;--event-s:#152a3e;--event-b:#193854;
 --life-c:#95b5be;--life-s:#152a38;--life-b:#1a3948;
 --resource-c:#9faac0;--resource-s:#1a2539;--resource-b:#22304a;
 --study-c:#92b2ca;--study-s:#14293d;--study-b:#183752;
 --tip-c:#a2b0bc;--tip-s:#1b2837;--tip-b:#253546;
 --qna-c:#96b4c0;--qna-s:#152a39;--qna-b:#1b384a;
 color-scheme:dark}
.project-card,.modal,.plist li{--cat-color:var(--class-c);--cat-soft:var(--class-s);--cat-border:var(--class-b)}
[data-cat-theme="class"]{--cat-color:var(--class-c);--cat-soft:var(--class-s);--cat-border:var(--class-b)}
[data-cat-theme="admin"]{--cat-color:var(--admin-c);--cat-soft:var(--admin-s);--cat-border:var(--admin-b)}
[data-cat-theme="event"]{--cat-color:var(--event-c);--cat-soft:var(--event-s);--cat-border:var(--event-b)}
[data-cat-theme="life"]{--cat-color:var(--life-c);--cat-soft:var(--life-s);--cat-border:var(--life-b)}
[data-cat-theme="resource"]{--cat-color:var(--resource-c);--cat-soft:var(--resource-s);--cat-border:var(--resource-b)}
[data-cat-theme="study"]{--cat-color:var(--study-c);--cat-soft:var(--study-s);--cat-border:var(--study-b)}
[data-cat-theme="tip"]{--cat-color:var(--tip-c);--cat-soft:var(--tip-s);--cat-border:var(--tip-b)}
[data-cat-theme="qna"]{--cat-color:var(--qna-c);--cat-soft:var(--qna-s);--cat-border:var(--qna-b)}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:var(--font-main);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;word-break:keep-all;overflow-wrap:break-word;overflow-x:clip;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.02em;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.layout{display:flex;width:100%;min-height:100vh}
/* 사이드바 */
.sidebar{width:248px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px;background:var(--card);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 16px;border-bottom:1px solid var(--line)}
.logo-icon{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--logo-a),var(--logo-b));color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px rgba(47,95,158,.22)}
.logo-icon .i{width:19px;height:19px}
.brand-name{font-size:1.04rem;font-weight:800;line-height:1.2;white-space:nowrap}
.brand-sub{font-size:.74rem;font-weight:500;color:var(--text-3);margin-top:2px}
.nav-group{margin:2px 10px 5px;font-size:.72rem;font-weight:700;color:var(--text-3);letter-spacing:.04em}
.board-nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:10px;text-align:left;color:var(--text-2);font-size:.88rem;font-weight:600;transition:var(--ease)}
.nav-num{width:20px;height:20px;border-radius:6px;background:var(--bg-soft);color:var(--text-3);font-size:.72rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--ease)}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{font-size:.74rem;font-weight:700;color:var(--text-3);background:var(--bg-soft);padding:2px 8px;border-radius:999px}
.nav-item:hover{background:var(--bg-soft);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav-item.active .nav-num{background:var(--accent);color:var(--on-accent)}
.nav-item.active .nav-count{background:var(--accent);color:var(--on-accent)}
.side-help{margin-top:auto;font-size:.78rem;color:var(--text-2);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.55}
.side-help b{display:block;color:var(--text);margin-bottom:4px}
/* 본문 */
.main{flex:1;min-width:0;padding-top:28px;padding-bottom:56px;padding-left:max(clamp(16px,3.5vw,56px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3.5vw,56px),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.page-title h1{font-size:clamp(1.35rem,2.2vw,1.75rem);font-weight:800;line-height:1.25}
.page-title p{color:var(--text-2);font-size:.88rem;margin-top:2px}
.search-box{position:relative;flex:1;min-width:220px;max-width:380px}
.search-box input{width:100%;padding:10px 16px 10px 40px;border-radius:10px;background:var(--card);border:1px solid var(--line-strong);color:var(--text);font:inherit;font-size:.9rem;transition:var(--ease)}
.search-box input::placeholder{color:var(--text-3)}
.search-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-box .i{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--text-3);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);color:var(--text);font-size:.86rem;font-weight:700;white-space:nowrap;transition:var(--ease)}
.btn:hover{background:var(--bg-soft)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-sm{padding:6px 12px;font-size:.8rem;border-radius:8px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:1.02rem;display:flex;align-items:center;gap:8px}
.section-head h2 .i{width:18px;height:18px;color:var(--accent)}
.section-note{font-size:.8rem;color:var(--text-3)}
/* 코스 레시피 */
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow-xs);transition:var(--ease);min-width:0}
.recipe:hover{border-color:var(--accent-border);box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.recipe.on{border-color:var(--accent);background:var(--accent-soft)}
.recipe b{font-size:.92rem}.recipe .rm{font-size:.74rem;font-weight:700;color:var(--accent)}
.recipe span.d{font-size:.8rem;color:var(--text-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* 필터 */
.filters{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.filter-btn{padding:6px 12px;border-radius:8px;border:1px solid transparent;color:var(--text-3);font-size:.82rem;font-weight:600;white-space:nowrap;transition:var(--ease)}
.filter-btn:hover{background:var(--bg-soft);color:var(--text)}
.filter-btn.active{background:var(--bg);border-color:var(--line-strong);color:var(--text)}
.filter-btn .dot{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.66rem;font-weight:800;text-align:center;margin-left:5px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px;border-top:1px solid var(--line);padding-top:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--text-2);font-size:.8rem;font-weight:600;transition:var(--ease)}
.chip small{color:var(--text-3);font-weight:700;font-size:.72rem}
.chip:hover{border-color:var(--accent-border);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent)}
.chip.on small{color:var(--accent)}
.actives{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.actives .chip .i{width:12px;height:12px}
.count{font-size:.82rem;color:var(--text-2);font-weight:600}
/* 카드 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.project-card{position:relative;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--cat-color);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;overflow:hidden;transition:var(--ease);cursor:pointer}
.project-card:hover{box-shadow:var(--shadow-hover);border-color:var(--cat-border);border-top-color:var(--cat-color);transform:translateY(-2px)}
.project-card:hover h3{color:var(--cat-color)}
.project-card.sel{background:var(--accent-soft);border-color:var(--accent-border);border-top-color:var(--cat-color)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.card-kind{display:inline-flex;align-items:center;padding:2.5px 8px;border-radius:999px;font-size:.7rem;font-weight:700;color:var(--cat-color);background:var(--cat-soft);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.card-badges{display:inline-flex;align-items:center;gap:4px;margin-left:auto;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;font-size:.68rem;font-weight:700;background:var(--bg-soft);color:var(--text-2);white-space:nowrap}
.badge .i{width:10px;height:10px}
.badge.warn{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.project-card h3{font-size:1.04rem;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.card-desc{font-size:.87rem;color:var(--text-2);line-height:1.56;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.7rem;font-weight:600;color:var(--text-3);background:var(--bg);border:1px solid var(--line);padding:1px 8px;border-radius:6px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.cid{font:700 .74rem ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-3)}
.btn.added{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.empty{grid-column:1/-1;text-align:center;color:var(--text-3);padding:40px 0}
/* 상세 모달 */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.scrim.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-modal);width:100%;max-width:720px;padding:26px 28px 22px;border-top:4px solid var(--cat-color);margin:auto 0}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.modal h2{font-size:1.3rem;line-height:1.35;margin-bottom:6px}
.modal .meta{font-size:.82rem;color:var(--text-2);margin-bottom:10px}
.modal .lead{font-size:.98rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.dsec{margin-top:18px}
.dsec h4{font-size:.88rem;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.dsec h4 .i{width:16px;height:16px;color:var(--accent)}
.dsec ul{padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:.92rem;color:var(--text-2)}
.dsec p{font-size:.92rem;color:var(--text-2)}
.pk{display:inline-block;font-size:.68rem;font-weight:800;border-radius:5px;padding:0 6px;margin-right:6px;background:var(--ok-bg);color:var(--ok)}
.pk.x{background:var(--gold-bg);color:var(--gold)}
.caution{background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold);border-radius:12px;padding:10px 14px;font-size:.9rem}
.pairs{display:flex;flex-wrap:wrap;gap:6px}
.pairs button{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:.8rem;font-weight:600;color:var(--text-2);text-align:left;transition:var(--ease)}
.pairs button:hover{border-color:var(--accent-border);color:var(--accent)}
.pairs button i{font:700 .72rem ui-monospace,monospace;font-style:normal;color:var(--text-3)}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
/* 내 강의 패널 */
.panel{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding:22px 18px 28px;overflow-y:auto}
.panel h2{font-size:1.04rem;display:flex;align-items:center;gap:8px}
.panel h2 .i{width:18px;height:18px;color:var(--accent)}
.tot{font-size:2rem;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.tot small{font-size:.8rem;font-weight:600;color:var(--text-3);margin-left:4px;letter-spacing:0}
.meter{height:8px;border-radius:6px;background:var(--bg-soft);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .3s}
.meter.over i{background:var(--gold)}
.tg{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--text-2);font-weight:600}
.panel input[type=number],.panel textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;min-width:0}
.panel input[type=number]{width:76px}
.panel textarea{width:100%;resize:vertical;font-size:.82rem;line-height:1.55}
.panel input:focus,.panel textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.panel>*{flex-shrink:0}
.plist{list-style:none;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--cat-color);border-radius:10px;padding:6px 8px}
.plist .t{flex:1;min-width:0;font-size:.82rem;font-weight:600;line-height:1.4}
.plist .t i{display:block;font:700 .68rem ui-monospace,monospace;font-style:normal;color:var(--text-3)}
.mini{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-3);transition:var(--ease)}
.mini:hover{background:var(--bg-soft);color:var(--text)}
.mini .i{width:14px;height:14px}
.plabel{font-size:.72rem;font-weight:700;color:var(--text-3);letter-spacing:.04em;margin-top:6px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* 패널 */
function reqText(){
 const tot=sel.reduce((a,i)=>a+BYID[i].min,0),tg=+$('target').value||tot,aud=$('aud').value.trim()||'(청중을 적어 주세요)';
 return `프로젝트 '바이브코딩'의 강의 소스 카드로 슬라이드를 만들어줘.\n\n- 청중·상황: ${aud}\n- 길이: ${tg}분 (카드 말하는 시간 합계 ${tot}분)\n- 사용할 카드(이 순서대로):\n${sel.map((i,n)=>`  ${n+1}. ${i} ${BYID[i].title} (${BYID[i].min}분)`).join('\n')||'  (없음)'}\n\n규칙:\n- 카드 원문은 claude/lecture-sources-*.md 에서 읽어 올 것 (카드 ID로 찾기).\n- 프롬프트는 [원문]은 그대로, [재구성]·[제안]·[요약]은 그렇게 표시해서 실제 입력처럼 보이게 하지 말 것.\n- 카드의 '주의'와 확인 필요 항목은 슬라이드 발표자 노트에 옮기고, 이름·주소·키·실제 금액은 가린 채 둘 것.\n- 캡처 대기 카드는 자리표시 슬라이드로 남길 것.\n- 카드 사이 이동 문장은 '함께 쓰면 좋은 카드' 관계를 참고해 이어 줄 것.`}
function renderRecipes(){
 const cur=sel.join();
 $('recipes').innerHTML=DATA.presets.map(p=>`<button class="recipe ${p.ids.join()===cur?'on':''}" data-pre="${p.id}"><b>${esc(p.name)}</b><span class="rm">${p.min}분 · ${p.ids.length}장</span><span class="d">${esc(p.desc)}</span></button>`).join('')}
function renderPanel(){
 const tot=sel.reduce((a,i)=>a+BYID[i].min,0),tg=+$('target').value||60;
 $('tot').textContent=tot;$('cnt').textContent=sel.length;
 const m=$('meter');m.classList.toggle('over',tot>tg);m.firstElementChild.style.width=Math.min(100,tot/tg*100)+'%';
 $('emptyMsg').classList.toggle('hide',sel.length>0);
 $('list').innerHTML=sel.map((i,n)=>`<li data-cat-theme="${th(BYID[i])}"><span class="t"><i>${i} · ${BYID[i].min}분</i>${esc(BYID[i].title)}</span><button class="mini" data-up="${n}" aria-label="위로">${ic('up')}</button><button class="mini" data-dn="${n}" aria-label="아래로">${ic('down')}</button><button class="mini" data-rm="${n}" aria-label="빼기">${ic('x')}</button></li>`).join('');
 $('req').value=reqText();$('fabT').textContent=`내 강의 ${sel.length}장 · ${tot}분`;renderRecipes();save()}
function refresh(){renderCards();renderPanel();if(openId&&$('scrim').classList.contains('show'))$('modal').innerHTML=detHTML(BYID[openId])}
function toggle(id){const k=sel.indexOf(id);k<0?sel.push(id):sel.splice(k,1);refresh()}
function toggleF(a,v){const s=F[a]||(F[a]=new Set());s.has(v)?s.delete(v):s.add(v);renderFilters();renderCards()}
function openPanel(o){$('panel').classList.toggle('open',o);$('ov').classList.toggle('show',o)}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-add],[data-close],[data-open],[data-a],[data-tab],[data-stage],[data-pre],[data-up],[data-dn],[data-rm],#clearF');if(!t)return;
 if(t.dataset.add){e.stopPropagation();toggle(t.dataset.add);return}
 if('close' in t.dataset){closeCard();return}
 if(t.dataset.open){openCard(t.dataset.open);return}
 if(t.dataset.a){toggleF(t.dataset.a,t.dataset.v);return}
 if(t.dataset.tab){tab=t.dataset.tab;renderFilters();return}
 if(t.dataset.stage){if(t.dataset.stage==='all')F.stages=new Set();else toggleF('stages',t.dataset.stage);renderFilters();renderCards();return}
 if(t.dataset.pre){const p=DATA.presets.find(x=>x.id===t.dataset.pre);sel=[...p.ids];$('target').value=parseInt(p.name)||p.min;refresh();return}
 if(t.dataset.up!==undefined){const n=+t.dataset.up;if(n>0){[sel[n-1],sel[n]]=[sel[n],sel[n-1]];refresh()}return}
 if(t.dataset.dn!==undefined){const n=+t.dataset.dn;if(n<sel.length-1){[sel[n+1],sel[n]]=[sel[n],sel[n+1]];refresh()}return}
 if(t.dataset.rm!==undefined){sel.splice(+t.dataset.rm,1);refresh();return}
 if(t.id==='clearF'){F={};renderFilters();renderCards()}
});
$('scrim').addEventListener('click',e=>{if(e.target===$('scrim'))closeCard()});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(openId)closeCard();else openPanel(false)}
 else if((e.key==='Enter'||e.key===' ')&&e.target.matches('.project-card')){e.preventDefault();openCard(e.target.dataset.open)}});
$('q').addEventListener('input',e=>{Q=e.target.value.trim().toLowerCase();renderFilters();renderCards()});
$('sort').onclick=()=>{const order=CARDS.map(c=>c.id),f=i=>Math.min(...BYID[i].stages);sel.sort((a,b)=>f(a)-f(b)||order.indexOf(a)-order.indexOf(b));refresh()};
$('reset').onclick=()=>{sel=[];refresh()};
$('aud').addEventListener('input',renderPanel);$('target').addEventListener('input',renderPanel);
$('fab').onclick=()=>openPanel(true);$('closeP').onclick=()=>openPanel(false);$('ov').onclick=()=>openPanel(false);
$('copy').onclick=async()=>{const ta=$('req'),msg=$('copied');try{await navigator.clipboard.writeText(ta.value);msg.textContent='복사했습니다'}catch(e){ta.focus();ta.select();msg.textContent='선택됨 — Ctrl+C로 복사해 주세요'}setTimeout(()=>msg.textContent='',3000)};
/* 아이콘 채우기 */
$('logo').innerHTML=ic('layers');$('sIc').innerHTML=ic('search');$('hRec').innerHTML=ic('book');$('hCard').innerHTML=ic('layers');$('hMine').innerHTML=ic('list');
$('closeP').innerHTML=ic('x');$('sort').innerHTML=ic('sort')+'단계 순 정렬';$('reset').innerHTML=ic('trash')+'비우기';$('copy').innerHTML=ic('copy')+'요청문 복사';$('fabI').innerHTML=ic('up');
$('sub').textContent=`카드 ${CARDS.length}장 · 합계 ${CARDS.reduce((a,c)=>a+c.min,0)}분 · 원문이 아니거나 확인할 것이 남은 카드에는 ‘확인’ 표시`;
['h2'].forEach(()=>{});document.querySelectorAll('.section-head h2 span').forEach(s=>{s.style.display='inline-flex'});
renderFilters();refresh();
</script>

</body>
</html>
